repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v15.0.7
    hooks:
      - id: clang-format
        types_or: [c++, cuda]

  - repo: local
    hooks:
      - id: actionlint
        name: Validate GitHub Actions workflows
        entry: actionlint -shellcheck=
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: shellcheck-publishing
        name: Validate Python release scripts
        entry: shellcheck
        language: system
        files: ^scripts/(publish_pypi|release_pycunls|build_pycunls|test_pycunls)\.sh$
