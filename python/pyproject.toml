[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "pycunls-cu13"
version = "0.4.3"
description = "Python bindings for cuNLS: CUDA-accelerated nonlinear least squares solver"
requires-python = ">=3.10"
# 1.18 is the first warp-lang whose PyPI wheels are CUDA 13 builds (the toolkit pycunls uses).
dependencies = ["numpy", "warp-lang>=1.18"]

[project.optional-dependencies]
# cupy only for the interoperability test (any __cuda_array_interface__ array works).
test = ["pytest", "cupy-cuda13x"]

[tool.scikit-build]
cmake.source-dir = ".."
cmake.args = ["-DBUILD_PYTHON_BINDINGS=ON", "-DBUILD_SHARED_LIBS=OFF"]
cmake.build-type = "Release"
wheel.packages = ["pycunls"]
build-dir = "build/{wheel_tag}"
