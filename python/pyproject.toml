[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "pycunls"
version = "0.2.0"
description = "Python bindings for cuNLS: CUDA-accelerated nonlinear least squares solver"
requires-python = ">=3.10"
dependencies = ["cupy-cuda12x"]

[project.optional-dependencies]
# warp-lang 1.18 builds its PyPI wheels with CUDA 13.4 and needs an R580+ driver for CUDA;
# older drivers (JetPack 6 on Jetson Orin) leave Warp CPU-only. Keep the CUDA 12 builds.
warp = ["warp-lang<1.18"]
test = ["pytest", "cupy-cuda12x", "warp-lang<1.18"]
all = ["warp-lang<1.18"]

[tool.scikit-build]
cmake.source-dir = ".."
cmake.args = ["-DBUILD_PYTHON_BINDINGS=ON", "-DBUILD_SHARED_LIBS=OFF"]
cmake.build-type = "Release"
wheel.packages = ["pycunls"]
build-dir = "build/{wheel_tag}"
