name: Build and Test

on:
  workflow_call:
    inputs:
      matrix_json:
        description: >
          JSON array of matrix entries. Each entry must have: ubuntu, cuda, archs.
          Optional: platform (default "x86_64"), runner (default ["self-hosted","gpu"]),
          base_image (overrides the Docker base image), ports_mirror (Ubuntu Ports mirror URL).
          Example: [{"ubuntu":"22.04","cuda":"12.8.1","archs":"75;80;86;89"}]
        type: string
        required: true
      artifact_retention_days:
        description: "Number of days to retain uploaded artifacts"
        type: number
        default: 30
      upload_binaries:
        description: "Upload compiled libraries and wheels as artifacts"
        type: boolean
        default: true
      timeout_minutes:
        description: "Per-job timeout in minutes"
        type: number
        default: 120

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-matrix:
    name: "${{ matrix.config.platform || 'x86_64' }} / ubuntu-${{ matrix.config.ubuntu }} / cuda-${{ matrix.config.cuda }}"
    runs-on: ${{ matrix.config.runner || fromJson('["self-hosted","gpu"]') }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(inputs.matrix_json) }}
    env:
      CONFIG_NAME: ${{ matrix.config.platform || 'x86_64' }}-cuda${{ matrix.config.cuda }}-ubuntu${{ matrix.config.ubuntu }}
      CUDA_VERSION: ${{ matrix.config.cuda }}
      UBUNTU_VERSION: ${{ matrix.config.ubuntu }}
      BASE_IMAGE: ${{ matrix.config.base_image }}
      UBUNTU_PORTS_MIRROR: ${{ matrix.config.ports_mirror }}

    steps:
      - name: Verify GPU
        run: nvidia-smi

      - uses: actions/checkout@v5

      - name: Build C++ libraries
        run: |
          EXTRA_CMAKE_ARGS="-DBUILD_TESTING=ON -DCMAKE_CUDA_ARCHITECTURES=${{ matrix.config.archs }}" \
          ./scripts/build_cunls_in_docker.sh Release ./output

      - name: Run C++ tests
        run: ./scripts/test_cunls_in_docker.sh ./output

      - name: Build Python wheel
        run: ./scripts/build_pycunls_in_docker.sh ./output/wheel

      - name: Run Python tests
        run: ./scripts/test_pycunls_in_docker.sh ./output/wheel

      - name: Upload C++ test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-cpp-${{ env.CONFIG_NAME }}
          path: output/cpp-test-results.xml
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: warn

      - name: Upload Python test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-python-${{ env.CONFIG_NAME }}
          path: output/wheel/python-test-results.xml
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: warn

      - name: Upload C++ libraries
        if: ${{ always() && inputs.upload_binaries }}
        uses: actions/upload-artifact@v6
        with:
          name: cunls-${{ env.CONFIG_NAME }}
          path: |
            output/shared/
            output/static/
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: warn

      # cuDSS is an optional runtime dependency (loaded via dlopen, not linked
      # into cunls); ship it as its own artifact, separate from the cunls
      # C++ libraries and Python wheel above.
      - name: Upload cuDSS binaries
        if: ${{ always() && inputs.upload_binaries }}
        uses: actions/upload-artifact@v6
        with:
          name: cudss-${{ env.CONFIG_NAME }}
          path: output/cudss/
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: warn

      - name: Upload Python wheel
        if: ${{ always() && inputs.upload_binaries }}
        uses: actions/upload-artifact@v6
        with:
          name: pycunls-${{ env.CONFIG_NAME }}
          path: output/wheel/*.whl
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: warn
