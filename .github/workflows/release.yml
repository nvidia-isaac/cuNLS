name: Release Python wheels

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYPI_PUBLISH_REPOSITORY: nvidia-isaac/cuNLS
  PYPI_ASSET_SOURCE: github-release
  WHEEL_DIR: pypi-wheels
  # The wheels are CUDA 13 only (the C++ library also supports CUDA 12).
  KITMAKER_PROJECTS: |
    pycunls-cu13=6866
  PYPI_PLATFORM: manylinux_*_x86_64
  PYPI_PROVENANCE_PATH: pycunls/_build_provenance.json
  PYPI_PER_RELEASE_PLC: ${{ vars.PYPI_PER_RELEASE_PLC || 'yes' }}
  # One cell per wheel, all built on Ubuntu 22.04: the wheel tag follows the build's glibc
  # (manylinux_2_35), which also installs on newer distributions.
  PYPI_PUBLISH_CELLS: &release_cells >-
    [{"cuda":"13.2.0","ubuntu":"22.04","python":"3.10","arch":"x86_64","archs":"75-real;80-real;86-real;89-real;90-real;100-real;120","artifact_dir":"pycunls-x86_64-cuda13.2.0-ubuntu22.04-py3.10"},
     {"cuda":"13.2.0","ubuntu":"22.04","python":"3.11","arch":"x86_64","archs":"75-real;80-real;86-real;89-real;90-real;100-real;120","artifact_dir":"pycunls-x86_64-cuda13.2.0-ubuntu22.04-py3.11"},
     {"cuda":"13.2.0","ubuntu":"22.04","python":"3.12","arch":"x86_64","archs":"75-real;80-real;86-real;89-real;90-real;100-real;120","artifact_dir":"pycunls-x86_64-cuda13.2.0-ubuntu22.04-py3.12"},
     {"cuda":"13.2.0","ubuntu":"22.04","python":"3.13","arch":"x86_64","archs":"75-real;80-real;86-real;89-real;90-real;100-real;120","artifact_dir":"pycunls-x86_64-cuda13.2.0-ubuntu22.04-py3.13"},
     {"cuda":"13.2.0","ubuntu":"22.04","python":"3.14","arch":"x86_64","archs":"75-real;80-real;86-real;89-real;90-real;100-real;120","artifact_dir":"pycunls-x86_64-cuda13.2.0-ubuntu22.04-py3.14"}]
  RELEASE_TAG: ${{ github.ref_name }}
  RELEASE_COMMIT: ${{ github.sha }}

jobs:
  build-matrix:
    if: github.repository == 'nvidia-isaac/cuNLS' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/build-and-test.yml
    with:
      matrix_json: *release_cells
      release_tag: ${{ github.ref_name }}
      artifact_retention_days: 30
      upload_binaries: true
      timeout_minutes: 120

  release:
    if: github.repository == 'nvidia-isaac/cuNLS' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-matrix, pypi-prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: pycunls-x86_64-*
          path: pypi-wheels
      - uses: actions/download-artifact@v7
        with:
          name: pypi-manifest
          path: .
      - run: bash scripts/release_pycunls.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: nvidia-isaac/cuNLS

  pypi-prepare:
    if: github.repository == 'nvidia-isaac/cuNLS' && startsWith(github.ref, 'refs/tags/v')
    needs: build-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: pycunls-x86_64-*
          path: pypi-wheels
      - run: sh scripts/publish_pypi.sh prepare
      - uses: actions/upload-artifact@v6
        with:
          name: pypi-manifest
          path: |
            pypi-manifest.json
            pypi-manifest.sha256
          if-no-files-found: error
          retention-days: 30

  pypi-verify-assets:
    if: github.repository == 'nvidia-isaac/cuNLS' && startsWith(github.ref, 'refs/tags/v')
    needs: [release, pypi-prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: pypi-manifest
          path: .
      - run: sh scripts/publish_pypi.sh verify-assets
