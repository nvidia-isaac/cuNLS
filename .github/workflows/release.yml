name: Release Python wheels

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYPI_PUBLISH_REPOSITORY: nvidia-isaac/cuNLS
  PYPI_ASSET_SOURCE: github-release
  PYPI_ASSET_DOWNLOAD_TIMEOUT_SECONDS: ${{ vars.PYPI_ASSET_DOWNLOAD_TIMEOUT_SECONDS || '1800' }}
  WHEEL_DIR: pypi-wheels
  KITMAKER_PROJECTS: |
    pycunls-cu12=6865
    pycunls-cu13=6866
  KITMAKER_PIC: hguillen@nvidia.com
  PYPI_PLATFORM: manylinux_*_x86_64
  PYPI_PROVENANCE_PATH: pycunls/_build_provenance.json
  PYPI_PER_RELEASE_PLC: ${{ vars.PYPI_PER_RELEASE_PLC || 'yes' }}
  PYPI_PUBLISH_CELLS: &release_cells >-
    [{"cuda":"12.8.1","ubuntu":"22.04","python":"3.10","arch":"x86_64","archs":"75;80;86;89","artifact_dir":"pycunls-x86_64-cuda12.8.1-ubuntu22.04"},
     {"cuda":"13.2.0","ubuntu":"22.04","python":"3.10","arch":"x86_64","archs":"75;80;86;89;100","artifact_dir":"pycunls-x86_64-cuda13.2.0-ubuntu22.04"},
     {"cuda":"12.8.1","ubuntu":"24.04","python":"3.12","arch":"x86_64","archs":"75;80;86;89","artifact_dir":"pycunls-x86_64-cuda12.8.1-ubuntu24.04"},
     {"cuda":"13.2.0","ubuntu":"24.04","python":"3.12","arch":"x86_64","archs":"75;80;86;89;100","artifact_dir":"pycunls-x86_64-cuda13.2.0-ubuntu24.04"}]
  RELEASE_TAG: ${{ github.ref_name }}
  RELEASE_COMMIT: ${{ github.sha }}

jobs:
  build-matrix:
    if: github.repository == 'nvidia-isaac/cuNLS' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/build-and-test.yml
    with:
      matrix_json: *release_cells
      release_tag: ${{ github.ref_name }}
      artifact_retention_days: 30
      upload_binaries: true
      timeout_minutes: 120

  release:
    if: github.repository == 'nvidia-isaac/cuNLS' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-matrix, pypi-prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: pycunls-x86_64-*
          path: pypi-wheels
      - uses: actions/download-artifact@v7
        with:
          name: pypi-manifest
          path: .
      - run: bash scripts/release_pycunls.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: nvidia-isaac/cuNLS

  pypi-prepare:
    if: github.repository == 'nvidia-isaac/cuNLS' && startsWith(github.ref, 'refs/tags/v')
    needs: build-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      verify_assets_timeout_minutes: ${{ steps.prepare.outputs.verify_assets_timeout_minutes }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: pycunls-x86_64-*
          path: pypi-wheels
      - id: prepare
        run: sh scripts/publish_pypi.sh prepare
      - uses: actions/upload-artifact@v6
        with:
          name: pypi-manifest
          path: |
            pypi-manifest.json
            pypi-manifest.sha256
          if-no-files-found: error
          retention-days: 30

  pypi-verify-assets:
    if: github.repository == 'nvidia-isaac/cuNLS' && startsWith(github.ref, 'refs/tags/v')
    needs: [release, pypi-prepare]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.pypi-prepare.outputs.verify_assets_timeout_minutes) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: pypi-manifest
          path: .
      - run: sh scripts/publish_pypi.sh verify-assets

  pypi-await-publication:
    name: PyPI publication confirmed
    if: >-
      github.repository == 'nvidia-isaac/cuNLS' &&
      startsWith(github.ref, 'refs/tags/v') &&
      vars.PYPI_PUBLICATION_ACK_ENABLED == 'true'
    needs: [pypi-prepare, pypi-verify-assets]
    runs-on: ubuntu-latest
    # Internal processing and approval may take >=24h; the native gate allows 30 days.
    # Tighten the approval deadline only after measuring production behavior.
    environment: kitmaker-publication
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: pypi-manifest
          path: .
      - run: sh scripts/publish_pypi.sh verify-publication
