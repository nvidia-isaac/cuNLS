project:
  name: cuNLS
  archetype: external_first
  build_system: cmake
  secondary_build_systems:
  - python
  test_frameworks:
  - googletest
  - pytest
  gpu_required_for_build: false
  gpu_required_for_test: true
  concerns:
  - python_publishing
docker:
  base_image_pattern: nvidia/cuda:{cuda_version}-devel-ubuntu{ubuntu_version}
  existing_dockerfile: scripts/Dockerfile
  registry: ''
  registry_login_secret: ''
matrix:
  cuda_versions:
  - 12.8.1
  - 13.2.0
  os_versions:
  - ubuntu22.04
  - ubuntu24.04
  python_versions:
  - '3.10'
  - '3.12'
  architectures:
  - x86_64
runners:
  platform: github_actions
  gpu_tags:
  - self-hosted
  - gpu
  cpu_tags:
  - ubuntu-latest
  gpu_job_timeout_minutes: 120
  cpu_job_timeout_minutes: 15
artifacts:
  test_output_format: junit_xml
  release_type: github_release
  publish_wheels: true
  wheel_destination: pypi
secrets:
- name: KITMAKER_TOKEN
  description: Kitmaker service token scoped to the protected pypi environment
  required: true
publishing:
  enabled: true
  legal_approval:
    answer: 'yes'
  canonical_repository: nvidia-isaac/cuNLS
  asset_source: github-release
  release_workflow: .github/workflows/release.yml
  release_job: release
  wheel_dir: pypi-wheels
  kitmaker_projects:
    pycunls-cu12: 6865
    pycunls-cu13: 6866
  pic: hguillen@nvidia.com
  owner_response_field: owner_email
  platform: manylinux_*_x86_64
  provenance_path: pycunls/_build_provenance.json
  provenance_source: python/pycunls/_build_provenance.json
  package_root: python
  environment: pypi
  publish_runner: gpu
  publish_cells:
  - cuda: 12.8.1
    ubuntu: '22.04'
    python: '3.10'
    arch: x86_64
    artifact_dir: pycunls-x86_64-cuda12.8.1-ubuntu22.04
  - cuda: 13.2.0
    ubuntu: '22.04'
    python: '3.10'
    arch: x86_64
    artifact_dir: pycunls-x86_64-cuda13.2.0-ubuntu22.04
  - cuda: 12.8.1
    ubuntu: '24.04'
    python: '3.12'
    arch: x86_64
    artifact_dir: pycunls-x86_64-cuda12.8.1-ubuntu24.04
  - cuda: 13.2.0
    ubuntu: '24.04'
    python: '3.12'
    arch: x86_64
    artifact_dir: pycunls-x86_64-cuda13.2.0-ubuntu24.04
  matrix_source: .github/workflows/release.yml
  version_source:
    path: python/pyproject.toml
  dry_run_only: true
  per_release_plc: true
